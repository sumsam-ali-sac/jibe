<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="The ship quality gate: checks, then four parallel reviewers, fix findings, commit, and open a PR only after you approve the push">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d3a"/>
      <stop offset="1" stop-color="#0b1329"/>
    </linearGradient>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8fbd"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b47"/>
    </marker>
    <style>
      .t  { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
      .h1 { font-size: 22px; font-weight: 700; fill: #eef1f8; }
      .sub{ font-size: 14px; fill: #9fb0d6; }
      .card{ fill: #16264a; stroke: #2a3d6b; stroke-width: 1.5; }
      .ct { font-size: 15px; font-weight: 700; fill: #eef1f8; }
      .cd { font-size: 12.5px; fill: #b8c4e0; }
      .rv { font-size: 14px; font-weight: 700; fill: #2ec4b6; }
      .rd { font-size: 11.5px; fill: #b8c4e0; }
      .flow { stroke: #7d8fbd; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <text x="32" y="44" class="t h1"><tspan class="m" style="fill:#ff8a6b">/ship</tspan>: the quality gate</text>
  <text x="32" y="68" class="t sub">Four reviewers run in parallel, in fresh contexts, unbiased by the reasoning that wrote the code.</text>

  <!-- checks -->
  <rect x="28" y="150" width="200" height="110" rx="14" class="card"/>
  <text x="128" y="182" text-anchor="middle" class="t ct">Checks</text>
  <text x="128" y="206" text-anchor="middle" class="t cd">lint · types · tests</text>
  <text x="128" y="224" text-anchor="middle" class="t cd">backend + frontend</text>
  <text x="128" y="242" text-anchor="middle" class="t cd">regenerate API client</text>

  <!-- reviewers stack: y 92, 150, 208, 266 (h 50) centers 117, 175, 233, 291 -->
  <g>
    <rect x="290" y="92" width="200" height="50" rx="10" class="card"/>
    <text x="306" y="113" class="m rv">code-reviewer</text>
    <text x="306" y="131" class="t rd">correctness · stack pitfalls</text>
  </g>
  <g>
    <rect x="290" y="150" width="200" height="50" rx="10" class="card"/>
    <text x="306" y="171" class="m rv" style="fill:#ff8a6b">security-reviewer</text>
    <text x="306" y="189" class="t rd">authz · injection · secrets</text>
  </g>
  <g>
    <rect x="290" y="208" width="200" height="50" rx="10" class="card"/>
    <text x="306" y="229" class="m rv" style="fill:#ffb347">verifier</text>
    <text x="306" y="247" class="t rd">every spec criterion covered</text>
  </g>
  <g>
    <rect x="290" y="266" width="200" height="50" rx="10" class="card"/>
    <text x="306" y="287" class="m rv" style="fill:#9aa8ff">ui-verifier</text>
    <text x="306" y="305" class="t rd">real browser, desktop + mobile</text>
  </g>
  <g class="flow">
    <path d="M230,205 C260,205 260,117 286,117" marker-end="url(#aw)"/>
    <path d="M230,205 C260,205 260,175 286,175" marker-end="url(#aw)"/>
    <path d="M230,205 C260,205 260,233 286,233" marker-end="url(#aw)"/>
    <path d="M230,205 C260,205 260,291 286,291" marker-end="url(#aw)"/>
    <path d="M492,117 C530,117 530,205 556,205" marker-end="url(#aw)"/>
    <path d="M492,175 C530,175 530,205 556,205"/>
    <path d="M492,233 C530,233 530,205 556,205"/>
    <path d="M492,291 C530,291 530,205 556,205"/>
  </g>

  <!-- fix -->
  <rect x="560" y="160" width="180" height="90" rx="14" class="card"/>
  <text x="650" y="192" text-anchor="middle" class="t ct">Fix findings</text>
  <text x="650" y="214" text-anchor="middle" class="t cd">critical and major</text>
  <text x="650" y="232" text-anchor="middle" class="t cd">re-run the checks</text>
  <line x1="742" y1="205" x2="786" y2="205" class="flow" marker-end="url(#aw)"/>

  <!-- commit -->
  <rect x="790" y="175" width="120" height="60" rx="14" class="card"/>
  <text x="850" y="211" text-anchor="middle" class="m" style="font-size:15px;font-weight:700;fill:#2ec4b6">/commit</text>
  <line x1="912" y1="205" x2="948" y2="205" class="flow" marker-end="url(#aw)"/>

  <!-- approval gate -->
  <path d="M1000,160 L1045,205 L1000,250 L955,205 Z" fill="#2a1e2a" stroke="#ff6b47" stroke-width="2"/>
  <text x="1000" y="201" text-anchor="middle" class="t" style="font-size:12px;font-weight:700;fill:#ffd0c2">you</text>
  <text x="1000" y="217" text-anchor="middle" class="t" style="font-size:12px;font-weight:700;fill:#ffd0c2">approve</text>
  <line x1="1047" y1="205" x2="1074" y2="205" stroke="#ff6b47" stroke-width="2.5" marker-end="url(#ac)"/>

  <!-- PR -->
  <rect x="1078" y="175" width="96" height="60" rx="14" fill="#1b2f5c" stroke="#ff6b47" stroke-width="2"/>
  <text x="1126" y="211" text-anchor="middle" class="m" style="font-size:14px;font-weight:700;fill:#ff8a6b">/open-pr</text>
</svg>
