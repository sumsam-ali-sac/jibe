<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hot-fix flow: branch hot-fix from production, add a regression test and minimal fix, merge into production and tag a patch, then merge back into the integration branch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d3a"/>
      <stop offset="1" stop-color="#0b1329"/>
    </linearGradient>
    <style>
      .t  { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Consolas, Menlo, monospace; }
      .h1 { font-size: 22px; font-weight: 700; fill: #eef1f8; }
      .sub{ font-size: 14px; fill: #9fb0d6; }
      .lane{ font-size: 13.5px; font-weight: 700; }
      .lanes{ font-size: 11.5px; fill: #9fb0d6; }
      .c  { font-size: 12px; fill: #d5ddef; }
      .tag{ font-size: 11.5px; font-weight: 700; fill: #0b1329; }
      .step{ font-size: 12.5px; fill: #b8c4e0; }
      .sn { font-size: 12px; font-weight: 800; fill: #0b1329; }
    </style>
  </defs>

  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <text x="32" y="44" class="t h1"><tspan class="m" style="fill:#ff8a6b">/hot-fix</tspan>: urgent production fixes</text>
  <text x="32" y="68" class="t sub">Branch from production, fix minimally with a regression test, release, then merge back so the fix isn't lost.</text>

  <!-- lane labels -->
  <text x="32" y="114" class="m lane" fill="#ffb347">main</text>
  <text x="32" y="130" class="t lanes">production</text>
  <text x="32" y="174" class="m lane" fill="#ff6b47">hot-fix/PROJ-201</text>
  <text x="32" y="190" class="t lanes">login-timeout</text>
  <text x="32" y="234" class="m lane" fill="#2ec4b6">develop</text>
  <text x="32" y="250" class="t lanes">integration</text>

  <!-- lanes -->
  <line x1="240" y1="118" x2="1168" y2="118" stroke="#ffb347" stroke-width="4" stroke-linecap="round"/>
  <line x1="240" y1="238" x2="1168" y2="238" stroke="#2ec4b6" stroke-width="4" stroke-linecap="round"/>
  <path d="M300,118 C350,118 360,178 420,178 L660,178 C720,178 730,118 790,118" stroke="#ff6b47" stroke-width="4" fill="none"/>
  <path d="M800,118 C860,118 870,238 930,238" stroke="#ffb347" stroke-width="3" fill="none" stroke-dasharray="7 6"/>

  <!-- main commits -->
  <circle cx="300" cy="118" r="10" fill="#0b1329" stroke="#ffb347" stroke-width="3.5"/>
  <rect x="270" y="86" width="60" height="20" rx="10" fill="#ffb347"/>
  <text x="300" y="100" text-anchor="middle" class="m tag">v1.4.0</text>

  <circle cx="800" cy="118" r="11" fill="#ffb347" stroke="#0b1329" stroke-width="3"/>
  <rect x="770" y="86" width="60" height="20" rx="10" fill="#ffb347"/>
  <text x="800" y="100" text-anchor="middle" class="m tag">v1.4.1</text>
  <text x="884" y="143" class="t c">PR merged into production</text>

  <!-- hot-fix commits -->
  <circle cx="480" cy="178" r="10" fill="#0b1329" stroke="#ff6b47" stroke-width="3.5"/>
  <text x="480" y="206" text-anchor="middle" class="t c">failing regression test</text>
  <circle cx="620" cy="178" r="10" fill="#0b1329" stroke="#ff6b47" stroke-width="3.5"/>
  <text x="620" y="206" text-anchor="middle" class="m c" style="fill:#ffb3a1">hot-fix: refresh token</text>

  <!-- develop commits -->
  <circle cx="420" cy="238" r="10" fill="#0b1329" stroke="#2ec4b6" stroke-width="3.5"/>
  <text x="420" y="266" text-anchor="middle" class="m c" style="fill:#a6e6df">feature: order cancel</text>
  <circle cx="940" cy="238" r="11" fill="#2ec4b6" stroke="#0b1329" stroke-width="3"/>
  <text x="940" y="266" text-anchor="middle" class="t c">fix merged back</text>
  <circle cx="1080" cy="238" r="10" fill="#0b1329" stroke="#2ec4b6" stroke-width="3.5"/>
  <text x="1080" y="266" text-anchor="middle" class="t c">next release keeps it</text>

  <!-- steps -->
  <g>
    <circle cx="48" cy="306" r="11" fill="#ff6b47"/><text x="48" y="310" text-anchor="middle" class="t sn">1</text>
    <text x="66" y="310" class="t step">branch from production</text>
    <circle cx="268" cy="306" r="11" fill="#ff6b47"/><text x="268" y="310" text-anchor="middle" class="t sn">2</text>
    <text x="286" y="310" class="t step">failing test + minimal fix + review</text>
    <circle cx="560" cy="306" r="11" fill="#ffb347"/><text x="560" y="310" text-anchor="middle" class="t sn">3</text>
    <text x="578" y="310" class="t step">PR into production, tag a patch release</text>
    <circle cx="890" cy="306" r="11" fill="#2ec4b6"/><text x="890" y="310" text-anchor="middle" class="t sn">4</text>
    <text x="908" y="310" class="t step">merge back into integration</text>
  </g>
</svg>
